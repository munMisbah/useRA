[package]
name = "usera"
version = "1.1.1"
edition = "2021"
rust-version = "1.88"
description = "useRA - Linux User & Group Manager TUI"
license = "MIT"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm_0_29"], default-features = false }

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
opt-level = "z"
panic = "abort"

  <text x="552" y="135" fill="#bac4cf">..</text>
  <text x="700" y="135" fill="#8793a1">&lt;up&gt;</text>

  <rect x="546" y="143" width="382" height="24" rx="3" fill="#282420"/>
  <path d="M 552 151 h 5 l 2 2 h 5 v 7 h -12 z" fill="#F56A00"/>
  <text x="570" y="160" fill="#bac4cf" font-weight="bold">app</text>
  <text x="700" y="160" fill="#34D399" font-weight="bold">0750+</text>
  <text x="786" y="160" fill="#bac4cf">root:www-data</text>

  <path d="M 552 176 h 5 l 2 2 h 5 v 7 h -12 z" fill="#8793a1"/>
  <text x="570" y="185" fill="#bac4cf">uploads</text>
  <text x="700" y="185" fill="#34D399">2775+</text>
  <text x="786" y="185" fill="#bac4cf">deploy:devs</text>

  <rect x="553" y="201" width="9" height="11" rx="1" fill="none" stroke="#8793a1" stroke-width="1.2"/>
  <text x="570" y="210" fill="#bac4cf">.env</text>
  <text x="700" y="210" fill="#bac4cf">0600</text>
  <text x="786" y="210" fill="#bac4cf">root:root</text>

  <path d="M 552 226 h 5 l 2 2 h 5 v 7 h -12 z" fill="#8793a1"/>
  <text x="570" y="235" fill="#bac4cf">logs</text>
  <text x="700" y="235" fill="#bac4cf">0750</text>
  <text x="786" y="235" fill="#bac4cf">syslog:adm</text>


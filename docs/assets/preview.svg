  <rect x="176" y="348" width="760" height="114" rx="7" fill="none" stroke="#8793a1" stroke-width="1.2"/>
  <rect x="188" y="340" width="76" height="16" fill="#141414"/>
  <text x="194" y="353" fill="#bac4cf" font-weight="bold">Details</text>

  <text x="192" y="376" fill="#F56A00" font-weight="bold">User:</text>
  <text x="236" y="376" fill="#bac4cf" font-weight="bold">deploy</text>
  <text x="294" y="376" fill="#bac4cf">(UID 1001, GID 1001, Regular)  Shell: /bin/bash  Home: /home/deploy</text>

  <text x="192" y="398" fill="#8793a1">Groups: sudo, www-data, devs</text>

  <text x="192" y="420" fill="#F56A00" font-weight="bold">Path:</text>
  <text x="236" y="420" fill="#bac4cf">/var/www/app</text>
  <text x="358" y="420" fill="#8793a1">Mode: drwxr-x--- (0750+)  Owner: root:www-data</text>

  <text x="192" y="442" fill="#8793a1">Effective for 'deploy':</text>
  <text x="380" y="442" fill="#34D399" font-weight="bold">rwx (user ACL)</text>
  <text x="502" y="442" fill="#8793a1">|  ACL: u:deploy:rwx, g:devs:r-x</text>

  <!-- Footer Status Bar -->
  <text x="30" y="492" fill="#F56A00" font-weight="bold">[CONTENT]</text>
  <text x="112" y="492" fill="#8793a1" font-size="12">↑↓ Select  A Add  P Passwd  E Shell  L/U Lock/Unlock  G Groups  D Delete  F HideFiles  r Reload  ? Help  Q Quit</text>
</svg>

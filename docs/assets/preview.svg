  <text x="424" y="135" fill="#bac4cf" font-weight="bold">Regular</text>

  <text x="192" y="160" fill="#bac4cf">alice</text>
  <text x="348" y="160" fill="#bac4cf">1002</text>
  <text x="424" y="160" fill="#bac4cf">Regular</text>

  <text x="192" y="185" fill="#8793a1">root</text>
  <text x="348" y="185" fill="#8793a1">0</text>

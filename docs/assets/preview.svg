  <text x="192" y="210" fill="#8793a1">www-data</text>
  <text x="348" y="210" fill="#8793a1">33</text>
  <text x="424" y="210" fill="#8793a1">System</text>

  <text x="192" y="235" fill="#8793a1">postgres</text>
  <text x="348" y="235" fill="#8793a1">108</text>
  <text x="424" y="235" fill="#8793a1">System</text>

